<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>偏差値診断</title>

  <style>
    
{
    box-sizing: border-box;}

    body {
      margin: 0;
      width: 100%;
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    #button {
      background: white;
      color: black;
      border: none;
      border-radius: 12px;
      padding: 20px 45px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      display: none;
      color: white;
      font-size: 50px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <button id="button">偏差値診断</button>

  <div id="result">🫡🫡</div>

  <script>
    document.getElementById("button").onclick = function () {
      this.style.display = "none";
      document.getElementById("result").style.display = "block";
    };
  </script>

</body>
</html>
