<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>偏差値診断</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }

    #button {
      background: white;
      color: black;
      border: none;
      border-radius: 10px;
      padding: 20px 50px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      display: none;
      gap: 15px;
    }

    #result img {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <button id="button">偏差値診断</button>

  <div id="result">
    <img src="salute.png" alt="🫡">
    <img src="salute.png" alt="🫡">
  </div>

  <script>
    document.getElementById("button").addEventListener("click", function() {
      this.style.display = "none";
      document.getElementById("result").style.display = "flex";
    });
  </script>

</body>
</html>
