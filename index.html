<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>偏差値診断</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }

    button {
      background: white;
      color: black;
      border: none;
      padding: 20px 50px;
      font-size: 24px;
      border-radius: 10px;
      cursor: pointer;
    }

    #result {
      display: none;
      color: white;
      font-size: 50px;
    }
  </style>
</head>

<body>

  <button id="button">偏差値診断</button>

  <div id="result">🫡🫡</div>

  <script>
    const button = document.getElementById("button");
    const result = document.getElementById("result");

    button.addEventListener("click", function() {
      button.style.display = "none";
      result.style.display = "block";
    });
  </script>

</body>
</html>
