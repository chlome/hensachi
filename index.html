<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>偏差値診断</title>

  <style>
    
{
    box-sizing: border-box;}

    body {
      margin: 0;
      width: 100%;
      height: 100vh;
      background: black;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: sans-serif;
    }

    #button {
      background: white;
      color: black;
      border: none;
      border-radius: 10px;

      padding: 20px 50px;
      font-size: 24px;
      font-weight: bold;

      cursor: pointer;
    }

    #result {
      display: none;
    }

    #result img {
      width: 80px;
      height: 80px;
      margin: 10px;
    }
  </style>
</head>

<body>

  <button id="button">偏差値診断</button>

  <div id="result">
    <img src="salute.png" alt="🫡">
    <img src="salute.png" alt="🫡">
  </div>

  <script>
    const button = document.getElementById("button");
    const result = document.getElementById("result");

    button.addEventListener("click", function () {
      button.style.display = "none";
      result.style.display = "flex";
    });
  </script>

</body>
</html>
